<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Page</title>
    <link rel="stylesheet" href="product_page_ui.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="web">
      <div class="main">
        <div class="basics">
          <div class="basiclogo">
            <i class="fa-solid fa-list"></i>
          </div>
        </div>
        <div class="pullbear">
          <div class="top">
            <div id="toptext">Pull&Bear</div>
          </div>
          <div class="center">
            <div class="frames">
              <div class="first">
                <img
                  src="product_ui_1.png"
                  alt="Main Picture"
                  height="100%"
                  width="100%"
                />
              </div>
              <div class="second">
                <img
                  src="product_ui_2.png"
                  alt="Main Picture"
                  height="100%"
                  width="100%"
                />
              </div>
              <div class="third">
                <img
                  src="product_ui_3.png"
                  alt="Main Picture"
                  height="100%"
                  width="100%"
                />
              </div>
            </div>
            <div class="main_image">
              <img
                src="product_ui_1.png"
                alt="Main Picture"
                height="100%"
                width="100%"
              />
            </div>
            <div class="content">
              <div class="heading">STRIPED SNOOPY T-SHIRT</div>
              <div class="price">
                15.99
                <i class="fa-solid fa-euro-sign"></i>
              </div>
              <div class="para">
                Women's basic short sleeve T-shirt with a round neckline and a
                logo print on the chest and back
              </div>
              <div class="dropdown">
                <div id="size">
                  <p id="last">S</p>
                </div>
                <div class="list">
                  <select name="size"></select>
                </div>
              </div>
              <div class="addtocart">ADD TO CART</div>
            </div>
          </div>
          <div class="bottom">
            <div id="prev">P R E V</div>
            <div id="next">N E X T</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
